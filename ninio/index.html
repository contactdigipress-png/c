<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninio — Ninios</title>
<meta name="description" content="loki">
<meta name="theme-color" content="#ff99e9">
<meta property="og:title" content="Ninio — Ninios">
<meta property="og:description" content="loki">
<meta property="og:image" content="logo.webp">

<style>
:root{--c:#ff99e9;--on:#111111;--acc:#ff99e9;--text:#1f2937;--bg:#f4f6f9;--card:#fff;--muted:#6b7280}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif;line-height:1.6;color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%}
a{color:var(--acc)}
.hero{background:var(--c);color:var(--on);text-align:center;padding:42px 20px 62px}
.logo{display:block;width:104px;height:104px;object-fit:contain;background:#fff;border-radius:50%;padding:8px;margin:0 auto 16px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
h1{font-size:1.8rem;line-height:1.2;overflow-wrap:anywhere}
.slogan{opacity:.92;margin-top:8px;font-size:1.05rem}
.badge{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:999px;font-size:.85rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;background:#fff;color:#111;text-decoration:none;font-weight:600;font-size:.95rem;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.btn.wa{background:#25D366;color:#fff}
main{max-width:720px;margin:-30px auto 0;padding:0 16px 30px;position:relative}
section{background:var(--card);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h2{font-size:1.1rem;margin-bottom:12px;color:var(--acc)}
p.about{overflow-wrap:anywhere}
.services{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.services li{background:var(--bg);padding:10px 14px;border-radius:12px;font-weight:500}
.services li::before{content:"✓";color:var(--acc);font-weight:700;margin-inline-end:8px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gallery a{display:block;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.info{list-style:none;display:flex;flex-direction:column;gap:14px}
.info li{display:flex;gap:12px;align-items:flex-start;overflow-wrap:anywhere}
.info .ic{font-size:1.2rem;line-height:1.5}
.info small{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
.social{display:flex;flex-wrap:wrap;gap:10px}
.social a{padding:8px 16px;border-radius:999px;background:var(--bg);text-decoration:none;font-weight:600;font-size:.9rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:6px 16px 30px}
.t-elegant{--bg:#faf8f5;--card:#fff;--text:#2b2b2b;--muted:#7a7570}
.t-elegant .hero{background:#fff;color:var(--text);border-bottom:4px solid var(--c)}
.t-elegant main{margin-top:22px}
.t-elegant h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:.5px}
.t-elegant .logo{box-shadow:none;border:1px solid #e8e2d8}
.t-elegant .badge{background:var(--c);color:var(--on)}
.t-elegant .btn{background:transparent;border:2px solid var(--c);color:var(--acc);box-shadow:none}
.t-elegant .btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.t-elegant section{border-radius:4px;box-shadow:none;border:1px solid #e8e2d8}
.t-elegant h2{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:2px;font-size:.92rem}
.t-elegant .services li,.t-elegant .social a{border-radius:2px}
.t-dark{--bg:#0f1115;--card:#181b22;--text:#e8eaed;--muted:#9aa0a6}
.t-dark .hero{background:linear-gradient(160deg,var(--c),#000 135%)}
.t-dark section{box-shadow:none;border:1px solid #262a33}
.t-dark .services li,.t-dark .social a{background:#222631;color:var(--text)}
.t-dark a{color:var(--acc)}
.t-dark .btn{color:#111}
.t-dark .btn.wa{color:#fff}
@media (min-width:600px){.gallery{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body class="t-dark">
<header class="hero">
<img class="logo" src="logo.webp" alt="Ninio">
<h1>Ninio</h1>
<p class="slogan">Parfait</p>
<span class="badge">Ninios</span>
<div class="actions"><a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=10%20Rue%20Euchkil%20la%20soukra" target="_blank" rel="noopener">📍 Itinéraire</a></div>
</header>
<main>
<section><h2>À propos</h2><p class="about">loki</p></section>
<section><h2>Nos services</h2><ul class="services"><li>LOKI1</li><li>LOKI2</li><li>LOKI3</li></ul></section>
<section><h2>Galerie</h2><div class="gallery"><a href="photo1.webp" target="_blank" rel="noopener"><img loading="lazy" src="photo1.webp" alt="Ninio 1"></a></div></section>
<section><h2>Contact</h2><ul class="info"><li><span class="ic">📍</span><div><small>Adresse</small>10 Rue Euchkil la soukra</div></li></ul></section>

</main>

</body>
</html>
